name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.1"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting, lint, and types
        run: s/lint
      - name: Run tests
        run: s/test
      - name: Build distributions
        run: s/build
      - name: Smoke-test installed wheel
        run: >-
          uv run --isolated --no-project --with ./dist/*.whl
          python -c "from sct_marimo import TerminologyAdapter; print(TerminologyAdapter.__name__)"

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check licensing metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@1.31.1
          fallback: none
      - name: Audit GitHub Actions
        run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}
